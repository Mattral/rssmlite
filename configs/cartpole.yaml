# CartPole-v1 — v3 config (EMA critic target)
#
# History of changes:
#   v1: seed_episodes=5, imagine_ratio=1, entropy_coef=0.0003
#       Result: policy never improved. Root cause: random-policy buffer
#       gave identical reward signal for all actions.
#   v2: seed_episodes=50, imagine_ratio=10, entropy_coef=0.003
#       Result: world model excellent (recon=0.003), but critic_loss
#       diverged to 40-50 immediately and never recovered. Root cause:
#       critic bootstrap target and online prediction co-move without
#       a target network.
#   v3 (this config): added CriticEMA target network (tau=0.02).
#       imagine_ratio reduced to 5 (stable critic means fewer steps needed).
#       entropy_coef kept at 0.003 for early exploration.

env:
  id: CartPole-v1
  max_episode_steps: 500

agent:
  rssm_kwargs:
    deter_dim: 128
    embed_dim: 128
    num_categoricals: 16
    num_classes: 16
    hidden_dim: 128
  hidden_dim: 128
  world_model_lr: 0.0003
  actor_lr: 0.00008
  critic_lr: 0.00008
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  critic_ema_tau: 0.02
  replay_capacity_episodes: 500

train:
  steps: 200000
  seed_episodes: 50
  batch_size: 16
  seq_len: 50
  horizon: 20
  imagine_ratio: 5
  checkpoint_every: 10000
