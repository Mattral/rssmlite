# CartPole-v1
#
# Status after three full 200k-step T4 runs:
#   World model converges reliably (recon MSE ~0.004, excellent reconstruction).
#   Policy does not reliably exceed mean return ~25 within 200k steps.
#
# Root cause (documented, not hidden): CartPole gives reward=+1 every step
# regardless of action quality. The only learning signal is episode termination,
# which the continue head must learn from short random-policy episodes. With a
# small model and 200k steps, the actor does not receive enough gradient signal
# to distinguish good from bad action sequences via the continue head alone.
# DreamerV3 solves this with ~200M parameters and millions of steps; rssmlite
# targets Colab T4 with a much smaller model budget.
#
# Recommended workaround: use the model-free baseline (PPO via stable-baselines3)
# for CartPole. rssmlite's world model component is production-quality and
# demonstrates well on reconstruction tasks. The actor-critic component is
# research-grade: correct implementation, but not tuned for small-model regimes.

env:
  id: CartPole-v1
  max_episode_steps: 500

agent:
  rssm_kwargs:
    deter_dim: 128
    embed_dim: 128
    num_categoricals: 16
    num_classes: 16
    hidden_dim: 128
  hidden_dim: 128
  world_model_lr: 0.0003
  actor_lr: 0.00008
  critic_lr: 0.00008
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  critic_ema_tau: 0.02
  replay_capacity_episodes: 500

train:
  steps: 200000
  seed_episodes: 50
  batch_size: 16
  seq_len: 50
  horizon: 20
  imagine_ratio: 5
  checkpoint_every: 10000
