# Minimal config to get a full CartPole training run working end-to-end
# (roadmap P1.3 exit criterion). obs_dim/action_dim/discrete are left out
# here and inferred from the env at runtime by `RSSMAgent.from_config` —
# P1.4 will make this file the single source of truth across all four
# target environments instead.

env:
  id: CartPole-v1
  max_episode_steps: 500

agent:
  rssm_kwargs:
    deter_dim: 128
    embed_dim: 128
    num_categoricals: 16
    num_classes: 16
    hidden_dim: 128
  hidden_dim: 128
  world_model_lr: 0.0003
  actor_lr: 0.00008
  critic_lr: 0.00008
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.0003
  replay_capacity_episodes: 500

train:
  steps: 200000
  seed_episodes: 5
  batch_size: 16
  seq_len: 50
  horizon: 15
  checkpoint_every: 10000
