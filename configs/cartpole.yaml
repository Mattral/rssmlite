# CartPole-v1 config — tuned after first real T4 run.
#
# Root cause of first failed run: with random-policy seed data and
# reward=+1/step regardless of action, the actor had no gradient signal
# distinguishing good from bad actions. Fixes:
#   - seed_episodes: 50 (was 5) — fill buffer with longer episodes so
#     the world model sees meaningful action consequences before actor trains
#   - imagine_ratio: 10 — 10 imagination steps per real step, giving the
#     actor 10x more gradient updates to learn from the world model
#   - entropy_coef: 0.003 (was 0.0003) — push actor to explore rather
#     than commit to one mediocre strategy
#   - horizon: 20 (was 15) — longer imagination gives more signal about
#     which actions lead to later termination

env:
  id: CartPole-v1
  max_episode_steps: 500

agent:
  rssm_kwargs:
    deter_dim: 128
    embed_dim: 128
    num_categoricals: 16
    num_classes: 16
    hidden_dim: 128
  hidden_dim: 128
  world_model_lr: 0.0003
  actor_lr: 0.00008
  critic_lr: 0.00008
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.003
  replay_capacity_episodes: 500

train:
  steps: 200000
  seed_episodes: 50
  batch_size: 16
  seq_len: 50
  horizon: 20
  imagine_ratio: 10
  checkpoint_every: 10000
